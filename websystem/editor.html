<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Incluir CSS de Bootstrap y Summernote -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote.min.css" rel="stylesheet">

        /* Ampliar el ancho del editor */
        #editor {
            width: 100%; /* Ocupa todo el ancho disponible */

<body>
    <!-- Contenedor del editor -->
    <textarea id="editor"></textarea>

    <!-- Modal para el explorador de imágenes -->
    <div id="modal-explorador" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarExplorador()">&times;</span>
            <h3>Explorador de Imágenes</h3>
    
            <!-- 🔹 FORMULARIO DE SUBIDA DE IMÁGENES -->
            <form id="form-subida" enctype="multipart/form-data">
                <input type="file" id="imagen" name="imagen" accept="image/*">
                <button type="button" class="boton-subir" onclick="subirImagen()">Subir Imagen</button>
                <button type="button" class="boton-eliminar" onclick="activarEliminar()">Eliminar</button>
            </form>
            <!-- 🔹 LISTADO DE IMÁGENES QUE SE ACTUALIZARÁ AUTOMÁTICAMENTE -->
            <div class="explorador" id="lista-imagenes">
                <?php
                $directorio = "../img/";
                $archivos = is_dir($directorio) ? scandir($directorio) : [];
                if (!empty($archivos)) {
                    foreach ($archivos as $archivo) {
                        if ($archivo != "." && $archivo != "..") {
                            $ruta = $directorio . $archivo;
                            echo "<div class='item' onclick='seleccionar(\"$ruta\")'>";
                            echo "<span class='eliminar-x' onclick='eliminarImagen(\"$archivo\", event)'>&times;</span>"; // ✅ Agregar botón de eliminar
                            echo "<img src='$ruta' alt='$archivo' class='preview'>";
                            echo "</div>";
                        }
                    }
                } else {
                    echo "<p>No se encontraron imágenes.</p>";
                }
                ?>
            </div>
        </div>
    </div>
    

    <!-- Incluir JS de jQuery, Bootstrap y Summernote -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote.min.js"></script>
    <script>
        // Función para mostrar el modal
        function mostrarExplorador() {
            document.getElementById('modal-explorador').style.display = 'block';
        }

        // Función para cerrar el modal
        function cerrarExplorador() {
            document.getElementById('modal-explorador').style.display = 'none';
        }

        $(document).ready(function() {
            $('#editor').summernote({
                height: 300, // Altura del editor en píxeles
                toolbar: [
                    ['style', ['style', 'bold', 'italic', 'underline', 'clear']],
                    ['font', ['strikethrough', 'superscript', 'subscript']],
                    ['fontname', ['fontname']],
                    ['color', ['forecolor', 'backcolor']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['insert', ['myModalButton', 'link', 'video', 'table']] // Agregar botón personalizado
                ],
                buttons: {
                    myModalButton: function(context) {
                        var ui = $.summernote.ui;
                        return ui.button({
                            contents: '<i class="note-icon-picture"/>', // Ícono del botón
                            tooltip: 'Abrir explorador de imágenes',
                            click: function() {
                                // Llama a la función para mostrar el modal
                                mostrarExplorador();
                            }
                        }).render();
                    }
                }
            });
        });
    </script>
</body>
</html>
